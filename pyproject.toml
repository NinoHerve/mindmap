[project]
name = "mindmap"
version = "0.0.1"
requires-python = "== 3.11.11"  # 3.10.16
description = "Python package to do EEG source reconstruction."
authors = [
    {name = "Nino Herve", email = "herve.nino@gmail.com"},
]
dependencies = [
    "jupyter>=0.0.1",
    "pyvista[all]>=0.0.1",
    "dash>=0.0.1",
    "mne>=0.0.1",
    "pyxu>=0.0.1",
    "antspyx>=0.0.1",
    "pygsp>=0.0.1",
    "nibabel>=0.0.1",
    "h5py>=0.0.1",
    "PyWavelets>=0.0.1",
    "numcodecs==0.15.1",
    "dash-bootstrap-components>=0.0.1",
    "dash-vtk>=0.0.1",
    "trimesh>=0.0.1",
    "embreex>=0.0.1",
    "seaborn[stats]>=0.0.1",
    "scikit-learn>=0.0.1",
    "scikit-image>=0.0.1",
    "bctpy>=0.0.1",
]

[project.optional-dependencies]
eval = [
]
test = ["pytest>=0.0.1"]

[project.scripts]
mindmap-viz = "mindmap.cli.viz:main"
mindmap-config = "mindmap.cli.config:main"


[tool.setuptools]
py-modules = ["mindmap"]